# Конфигурация Alembic.
# sqlalchemy.url задаётся программно из app.config (DATABASE_URL) — см.
# app/alembic_runner.py и alembic/env.py. Значение ниже — только дефолт для
# ручного запуска `alembic ...` из каталога backend.

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///messenger.db
